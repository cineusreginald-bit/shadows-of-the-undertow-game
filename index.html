<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadows of the Undertow · Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#070708; --fg:#ecebe7; --muted:#8f8b86; --line:rgba(236,235,231,.16); --red:#e2563f; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; }
body { background:var(--bg); color:var(--fg); font-family:"Geist","Helvetica Neue",Arial,sans-serif; display:grid; align-content:center; min-height:100vh; padding:48px max(20px,6vw); }
.label { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
h1 { font-family:"Montserrat","Arial Black",sans-serif; font-weight:800; text-transform:uppercase; line-height:.92; font-size:clamp(40px,8vw,104px); margin:14px 0 36px; }
h1 em { font-style:normal; color:var(--red); }
.games { display:grid; gap:14px; max-width:820px; }
a.game { display:grid; gap:6px; padding:22px 24px; border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:border-color .2s, transform .2s; }
a.game:hover, a.game:focus-visible { border-color:var(--red); transform:translateY(-1px); outline:none; }
a.game b { font-family:"Montserrat","Arial Black",sans-serif; font-weight:800; text-transform:uppercase; font-size:22px; }
a.game span { color:var(--muted); line-height:1.5; }
footer { margin-top:40px; }
</style>
<span class="label">Shadows of the Undertow · Playable</span>
<h1>Run from the <em>shadow</em></h1>
<div class="games">
  <a class="game" href="keep-the-light/"><b>Keep the Light</b><span>The chaptered game. Escape the cell, keep your torch burning, and face the wolf.</span></a>
  <a class="game" href="outrun-the-shadow/"><b>Outrun the Shadow</b><span>The chase. Reach the water before the seven eyes reach you.</span></a>
</div>
